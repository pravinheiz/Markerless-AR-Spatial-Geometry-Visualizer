<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Spatial Geometry Visualizer</title>
    
    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Legacy MediaPipe Hands (No WASM issues) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Layer 0: Webcam -->
    <video id="input-video" style="display:none;"></video>
    
    <!-- Layer 1: 3D Scene -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Layer 2: Hand Skeleton Overlay -->
    <canvas id="output-canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="panel top-left">
            <h1>AR Geometry Visualizer</h1>
            <div class="status-indicator" id="gesture-status">LOADING...</div>
            <div class="sub-status" id="mode-status">Mode: IDLE</div>
        </div>

        <div class="panel top-right">
            <h3>Controls</h3>
            <ul>
                <li><span class="key">Pinch</span> Draw / Select</li>
                <li><span class="key">Grab + Twist</span> Rotate Object</li>
                <li><span class="key">2-Hand Pinch</span> Zoom In/Out</li>
                <li><span class="key">2-Hand Vertical</span> Extrude 3D</li>
                <li><span class="key">Fist (1s)</span> Undo</li>
            </ul>
        </div>

        <div class="panel bottom-left">
            <button id="toggle-skeleton">Hide Skeleton</button>
            <button id="reset-scene">Reset Scene</button>
        </div>

        <div class="panel bottom-right">
            <div>FPS: <span id="fps-counter">0</span></div>
            <div>Confidence: <span id="conf-text">0%</span></div>
            <div class="bar-container"><div id="conf-fill"></div></div>
        </div>

        <div id="crosshair" class="hidden">+</div>
        <div id="prompt-overlay" class="hidden">PINCH TO DRAW</div>
    </div>

    <div id="loading-screen">
        <div class="spinner"></div>
        <h2>Initializing Hand Tracking...</h2>
        <p>Please allow camera access.</p>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
