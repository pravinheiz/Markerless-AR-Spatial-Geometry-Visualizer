<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markerless AR Spatial Geometry Visualizer</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- MediaPipe Hands & Drawing Utils ONLY (Removed Camera Utils) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Video Input (Hidden) -->
    <video id="input-video" playsinline muted></video>
    
    <!-- Canvas for Hand Landmarks Overlay -->
    <canvas id="output-canvas"></canvas>

    <!-- Three.js Rendering Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- HUD Overlay -->
    <div id="hud">
        <div class="panel">
            <h2>AR Geometry Visualizer</h2>
            <div class="stat-row">
                <span class="label">Mode:</span>
                <span id="mode-display" class="value">INITIALIZING</span>
            </div>
            <div class="stat-row">
                <span class="label">Gesture:</span>
                <span id="gesture-display" class="value">NONE</span>
            </div>
            <div class="stat-row">
                <span class="label">Pinch Dist:</span>
                <span id="pinch-display" class="value">0.00</span>
            </div>
            <div class="stat-row">
                <span class="label">Hands:</span>
                <span id="hands-display" class="value">0</span>
            </div>
            <div class="instructions">
                <h3>Controls</h3>
                <ul>
                    <li><strong>PINCH + DRAG:</strong> Draw 2D Shape</li>
                    <li><strong>RELEASE:</strong> Confirm Shape</li>
                    <li><strong>TWO HANDS UP/DOWN:</strong> Extrude to 3D</li>
                    <li><strong>TWO HANDS APART:</strong> Zoom / Scale</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p id="loading-text">Loading Computer Vision Models...</p>
        <button id="start-camera-btn" style="display:none; margin-top:15px; padding:10px 20px; background:#00ff88; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">Enable Camera</button>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
