<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Spatial Geometry Visualizer</title>
    
    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- ROBUST MEDIAPIPE LEGACY CDN (No WASM fetching issues) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LAYER 0: Webcam -->
    <video id="webcam-video" autoplay playsinline muted></video>

    <!-- LAYER 1: Three.js Scene -->
    <canvas id="webgl-canvas"></canvas>

    <!-- LAYER 2: Hand Skeleton Overlay -->
    <canvas id="hand-canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="panel top-left">
            <h1>AR Geometry Visualizer</h1>
            <div class="status-indicator" id="gesture-status">INITIALIZING...</div>
            <div class="sub-status" id="mode-status">Mode: IDLE</div>
        </div>

        <div class="panel top-right">
            <h3>Gesture Guide</h3>
            <ul>
                <li><span class="key">Pinch</span> Draw / Select</li>
                <li><span class="key">Grab</span> Move Object</li>
                <li><span class="key">2-Hand Split</span> Extrude 3D</li>
                <li><span class="key">Fist (1s)</span> Undo</li>
            </ul>
        </div>

        <div class="panel bottom-left">
            <button id="toggle-skeleton">Hide Skeleton</button>
            <button id="reset-scene">Reset Scene</button>
        </div>

        <div class="panel bottom-right">
            <div>FPS: <span id="fps-counter">0</span></div>
            <div>Conf: <span id="conf-bar">0%</span></div>
            <div class="bar-container"><div id="conf-fill"></div></div>
        </div>

        <div id="crosshair" class="hidden">+</div>
        <div id="prompt-overlay" class="hidden">PINCH TO DRAW</div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h2>Loading Hand Tracking...</h2>
        <p id="loading-msg">Initializing models...</p>
        <button id="start-btn" style="display:none; margin-top:15px; padding:10px 20px; background:#00ff88; border:none; color:#000; font-weight:bold; cursor:pointer;">START CAMERA</button>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
