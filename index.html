<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Spatial Geometry Visualizer</title>
    
    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Legacy MediaPipe Hands (Robust, no WASM fetch issues) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LAYER 0: Real Webcam Feed (Background) -->
    <video id="webcam-input" autoplay playsinline muted></video>

    <!-- LAYER 1: Three.js 3D Scene (Transparent Middle) -->
    <canvas id="webgl-canvas"></canvas>

    <!-- LAYER 2: Hand Skeleton Overlay (Front) -->
    <canvas id="hand-canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="panel top-left">
            <h1>Spatial Geometry AR</h1>
            <div id="gesture-display" class="status">INITIALIZING...</div>
            <div id="mode-display" class="sub-status">Mode: IDLE</div>
        </div>

        <div class="panel top-right">
            <h3>Controls</h3>
            <ul>
                <li><span class="key">Pinch</span> Free Draw 3D Path</li>
                <li><span class="key">Grab</span> Rotate (X/Y) & Move</li>
                <li><span class="key">2-Hand Spread</span> Zoom Camera</li>
                <li><span class="key">2-Hand Vertical</span> Extrude Shape</li>
            </ul>
        </div>

        <div class="panel bottom-left">
            <button id="btn-reset">Reset Scene</button>
            <button id="btn-skeleton">Toggle Skeleton</button>
        </div>

        <div class="panel bottom-right">
            <div>FPS: <span id="fps-val">0</span></div>
            <div>Tracking: <span id="track-val">0%</span></div>
            <div class="bar"><div id="track-bar"></div></div>
        </div>

        <div id="crosshair" class="hidden">+</div>
        <div id="prompt" class="hidden">PINCH TO DRAW</div>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <h2>Initializing Vision System...</h2>
        <p>Please allow camera access.</p>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
