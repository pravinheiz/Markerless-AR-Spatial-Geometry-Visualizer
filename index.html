<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Spatial Geometry Visualizer</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="input-video" style="display:none;"></video>
    <canvas id="output-canvas"></canvas>
    <canvas id="webgl-canvas"></canvas>

    <div id="hud">
        <div class="panel">
            <h2>AR Geometry Visualizer</h2>
            <div class="stat-row">
                <span class="label">Mode:</span>
                <span id="mode-display" class="value">INITIALIZING</span>
            </div>
            <div class="stat-row">
                <span class="label">Gesture:</span>
                <span id="gesture-display" class="value">NONE</span>
            </div>
            <div class="stat-row">
                <span class="label">Pinch Dist:</span>
                <span id="pinch-display" class="value">0.00</span>
            </div>
            <div class="instructions">
                <h3>Controls</h3>
                <ul>
                    <li><span class="highlight">PINCH</span> (Thumb+Index): Grab / Draw</li>
                    <li><span class="highlight">DRAG</span>: Move Cursor / Resize Shape</li>
                    <li><span class="highlight">TWO HANDS Vertical</span>: Extrude 3D</li>
                    <li><span class="highlight">TWO HANDS Horizontal</span>: Zoom Camera</li>
                </ul>
            </div>
        </div>
    </div>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p>Loading Computer Vision Models...</p>
        <p style="font-size: 0.8rem; color: #aaa; margin-top: 10px;">Allow Camera Access to Continue</p>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
