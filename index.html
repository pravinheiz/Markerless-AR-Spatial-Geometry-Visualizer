<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Geometry Visualizer | AVP Style</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="input-video" style="display:none;" playsinline></video>
    <canvas id="output-canvas"></canvas>
    <canvas id="webgl-canvas"></canvas>

    <div id="hud">
        <div class="panel">
            <h2>Spatial Geometry AR</h2>
            <div class="stat-row">
                <span class="label">Mode:</span>
                <span id="mode-display" class="value">IDLE</span>
            </div>
            <div class="stat-row">
                <span class="label">Shape:</span>
                <span id="shape-display" class="value">PYRAMID</span>
            </div>
            <div class="stat-row">
                <span class="label">Gesture:</span>
                <span id="gesture-display" class="value">NONE</span>
            </div>
            <div class="instructions">
                <h3>Gestures</h3>
                <ul>
                    <li><strong>PINCH + DRAG:</strong> Draw Shape</li>
                    <li><strong>CIRCLE MOTION:</strong> Switch to Torus</li>
                    <li><strong>FAST FLICK:</strong> Switch to Octahedron</li>
                    <li><strong>TWO HANDS UP:</strong> Extrude 3D</li>
                    <li><strong>TWO HANDS APART:</strong> Zoom Camera</li>
                </ul>
            </div>
        </div>
    </div>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p>Loading Spatial Models...</p>
        <button id="start-camera-btn" style="display:none; margin-top:20px; padding:10px 20px; background:#00ff88; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">Enable Camera</button>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
